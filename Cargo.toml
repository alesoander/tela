[package]
name = "tela"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Notas privadas superpuestas para presentar compartiendo pantalla en Hyprland/Wayland"

[dependencies]
cairo-rs = "0.22.11"
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"] }
libc = "0.2.191"
poppler-rs = "0.26"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
